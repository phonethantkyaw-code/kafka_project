<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Router Command Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#16283a;font:16px system-ui,sans-serif}main{max-width:980px;margin:48px auto;padding:0 24px}.eyebrow{color:#18716d;font-size:12px;font-weight:750;letter-spacing:2px}h1{font-size:36px;margin:12px 0}p{color:#52677b;line-height:1.6}.card{background:white;border:1px solid #d9e3ec;border-radius:16px;padding:24px;margin:24px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{font-weight:650;font-size:14px}select{display:block;width:100%;margin:10px 0 20px;padding:12px;border:1px solid #becbd7;border-radius:8px;background:white;font:inherit}button{border:0;border-radius:8px;background:#146a65;color:white;padding:12px 20px;cursor:pointer;font:inherit;font-weight:650}button:disabled{opacity:.5;cursor:wait}#status{margin:18px 0 4px;font-weight:650}pre{background:#142434;color:#ddf6eb;padding:20px;border-radius:12px;overflow:auto;min-height:130px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}h2{font-size:20px}.job{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid #e5ebf0;padding:12px 0}.job button{background:#edf4f4;color:#146a65;font-size:13px;padding:8px 12px}small{color:#52677b;overflow-wrap:anywhere}@media(max-width:600px){.fields{grid-template-columns:1fr}h1{font-size:28px}main{margin:24px auto}.job{align-items:flex-start}}
</style></head><body><main>
<div class="eyebrow">NETWORK AUTOMATION LAB</div><h1>Run a router command</h1><p>Choose a router and a diagnostic command. Your request is queued for execution, and the result appears below.</p>
<section class="card"><form id="form"><div class="fields"><label>Router<select id="router" required></select></label><label>Command<select id="action" required></select></label></div><button id="send" disabled>Execute command</button></form><div id="status" role="status" aria-live="polite">Loading router options…</div><small id="jobid"></small><pre id="output">No command executed yet.</pre></section>
<section class="card"><h2>Recent requests</h2><p>Select a request to view its status and output.</p><div id="history"></div></section></main>
<script>
const el=id=>document.getElementById(id);let selected=null,refreshBusy=false;
async function api(path,options){const r=await fetch(path,options);const data=await r.json();if(!r.ok){const err=new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));err.data=data;throw err}return data}
function show(job){el('status').textContent=job.router_id+' · '+job.status;el('jobid').textContent='Job '+job.job_id;el('output').textContent=job.output||(job.status==='queued'?'Waiting for the worker…':job.status==='running'?'Connecting to the router…':'No output yet.');}
async function refresh(){if(refreshBusy)return;refreshBusy=true;try{const jobs=await api('/jobs');el('history').replaceChildren();if(!jobs.length)el('history').textContent='No requests yet.';for(const job of jobs){const row=document.createElement('div');row.className='job';const text=document.createElement('span');text.textContent=job.router_id+' · '+job.command+' · '+job.status;const btn=document.createElement('button');btn.textContent='View result';btn.onclick=()=>{selected=job.job_id;show(job)};row.append(text,btn);el('history').append(row)}if(selected){const job=jobs.find(j=>j.job_id===selected)||await api('/jobs/'+encodeURIComponent(selected));show(job)}}catch(err){el('status').textContent='Cannot refresh results: '+err.message}finally{refreshBusy=false}}
el('form').onsubmit=async e=>{e.preventDefault();el('send').disabled=true;el('status').textContent='Submitting request…';try{const job=await api('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({router_id:el('router').value,action:el('action').value})});selected=job.job_id;await refresh()}catch(err){selected=err.data?.detail?.job_id||null;el('status').textContent='Request error: '+err.message;if(selected)el('jobid').textContent='Job '+selected}finally{el('send').disabled=false}};
(async()=>{try{const options=await api('/options');for(const[id,host]of Object.entries(options.routers)){el('router').add(new Option(id+' — '+host,id))}for(const[id,command]of Object.entries(options.commands)){el('action').add(new Option(command,id))}el('send').disabled=false;el('status').textContent='Ready';await refresh();setInterval(refresh,2000)}catch(err){el('status').textContent='Could not load the page: '+err.message}})();
</script></body></html>
